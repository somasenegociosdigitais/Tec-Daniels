name: Deploy para Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o sitemap usa a data do último commit de cada página.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build

      # O Astro ignora arquivos que começam com ponto em public/,
      # então o .htaccess precisa ser copiado à mão para o dist.
      - name: Copiar .htaccess para o dist
        run: |
          cp public/.htaccess dist/.htaccess
          mkdir -p dist/.well-known
          cp public/.well-known/ai.txt dist/.well-known/ai.txt

      - name: Enviar dist/ por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          # Nome novo do controle de sincronização: força o envio completo do dist/.
          state-name: .ftp-deploy-sync-state-v3.json
          log-level: standard
          # Não mexer no que não vem do build
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            googleed523001b3cdf1bd.html
            system/**
            .well-known/acme-challenge/**
            .well-known/pki-validation/**
